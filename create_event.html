{% extends 'base.html' %}
{% block title %}Create Event - Campus Connect{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-6 py-6">
  
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-2xl font-bold text-white flex items-center gap-2">
      <i class="fa-solid fa-calendar-plus text-orange-400"></i> Create Academic Event
    </h1>
    <a href="{{ url_for('faculty_dashboard') }}" class="px-4 py-2 bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 text-xs font-semibold rounded-lg transition-all">
      <i class="fa-solid fa-arrow-left mr-1.5"></i> Back to Dashboard
    </a>
  </div>

  <div class="glass-card p-6 rounded-xl relative overflow-hidden">
    <div class="absolute -top-16 -right-16 w-32 h-32 bg-orange-500/10 rounded-full blur-2xl"></div>

    <form action="{{ url_for('faculty_create_event') }}" method="POST" class="space-y-4">
      <div>
        <label for="title" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Event Title</label>
        <input type="text" name="title" id="title" required placeholder="Web Dev Hack-Session" 
          class="glass-input w-full h-11 px-4 rounded-xl text-sm focus:outline-none placeholder-slate-600">
      </div>

      <div>
        <label for="description" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Detailed Description</label>
        <textarea name="description" id="description" required rows="4" placeholder="Outline context, pre-requisites, room numbers, and speaker details..." 
          class="glass-input w-full p-4 rounded-xl text-sm focus:outline-none placeholder-slate-600"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="date" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Date & Time</label>
          <input type="text" name="date" id="date" required placeholder="2026-06-22 02:00 PM" 
            class="glass-input w-full h-11 px-4 rounded-xl text-sm focus:outline-none placeholder-slate-600">
        </div>
        <div>
          <label for="type" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Event Category</label>
          <select name="type" id="type" required 
            class="glass-input w-full h-11 px-4 rounded-xl text-sm focus:outline-none bg-slate-900">
            <option value="Academic" selected>Academic</option>
            <option value="Placement">Placement / Drive</option>
            <option value="Extracurricular">Extracurricular</option>
          </select>
        </div>
      </div>

      <button type="submit" 
        class="w-full h-11 mt-4 rounded-xl bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-400 hover:to-amber-500 text-white text-sm font-semibold shadow-lg shadow-orange-500/10 transition-all">
        Publish Event Calendar
      </button>
    </form>
  </div>

</div>
{% endblock %}
