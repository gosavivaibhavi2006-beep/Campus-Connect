{% extends 'base.html' %}
{% block title %}Campus Connect - Register{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-12">
  <div class="glass-card p-8 rounded-2xl relative overflow-hidden">
    <div class="absolute -top-16 -right-16 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl"></div>
    <div class="absolute -bottom-16 -left-16 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>

    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-white mb-2">Create Account</h2>
      <p class="text-sm text-slate-400">Join the Campus Connect Portal</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
      
      <div>
        <label for="name" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Full Name</label>
        <input type="text" name="name" id="name" required placeholder="John Doe" 
          class="glass-input w-full h-10 px-4 rounded-xl text-sm focus:outline-none placeholder-slate-600">
      </div>

      <div>
        <label for="username" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Username</label>
        <input type="text" name="username" id="username" required placeholder="johndoe" 
          class="glass-input w-full h-10 px-4 rounded-xl text-sm focus:outline-none placeholder-slate-600">
      </div>

      <div>
        <label for="email" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Email Address</label>
        <input type="email" name="email" id="email" required placeholder="doe@campus.edu" 
          class="glass-input w-full h-10 px-4 rounded-xl text-sm focus:outline-none placeholder-slate-600">
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Password</label>
        <input type="password" name="password" id="password" required placeholder="••••••••" 
          class="glass-input w-full h-10 px-4 rounded-xl text-sm focus:outline-none placeholder-slate-600">
      </div>

      <div>
        <label for="role" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">User Role</label>
        <select name="role" id="role-select" required 
          class="glass-input w-full h-10 px-4 rounded-xl text-sm focus:outline-none bg-slate-900">
          <option value="student" selected>Student</option>
          <option value="faculty">Faculty / Assessor</option>
        </select>
      </div>

      <!-- Conditional Input: Student Roll Number -->
      <div id="student-field">
        <label for="roll_no" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Roll Number</label>
        <input type="text" name="roll_no" id="roll_no" placeholder="STU-1234" 
          class="glass-input w-full h-10 px-4 rounded-xl text-sm focus:outline-none placeholder-slate-600">
      </div>

      <!-- Conditional Input: Faculty Employee ID -->
      <div id="faculty-field" class="hidden">
        <label for="emp_id" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Employee ID</label>
        <input type="text" name="emp_id" id="emp_id" placeholder="FAC-5678" 
          class="glass-input w-full h-10 px-4 rounded-xl text-sm focus:outline-none placeholder-slate-600">
      </div>

      <button type="submit" 
        class="w-full h-11 mt-4 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white text-sm font-semibold shadow-lg shadow-cyan-500/15 hover:shadow-cyan-500/25 transition-all transform active:scale-[0.98]">
        Sign Up
      </button>

    </form>

    <div class="mt-6 pt-6 border-t border-slate-800 text-center text-xs text-slate-400">
      <span>Already have an account? </span>
      <a href="{{ url_for('login') }}" class="text-cyan-400 font-semibold hover:underline">Log in here</a>
    </div>
  </div>
</div>

<script>
  // Simple listener to switch conditional field visibility
  const roleSelect = document.getElementById('role-select');
  const stuField = document.getElementById('student-field');
  const facField = document.getElementById('faculty-field');
  
  if (roleSelect && stuField && facField) {
    roleSelect.addEventListener('change', (e) => {
      if (e.target.value === 'faculty') {
        stuField.classList.add('hidden');
        facField.classList.remove('hidden');
      } else {
        stuField.classList.remove('hidden');
        facField.classList.add('hidden');
      }
    });
  }
</script>
{% endblock %}
