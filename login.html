{% extends 'base.html' %}
{% block title %}Campus Connect - Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-12">
  <div class="glass-card p-8 rounded-2xl relative overflow-hidden">
    <div class="absolute -top-16 -right-16 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl"></div>
    <div class="absolute -bottom-16 -left-16 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>

    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-white mb-2">Welcome Back</h2>
      <p class="text-sm text-slate-400">Sign in to your Campus Connect account</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
      
      <div>
        <label for="username" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Username</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
            <i class="fa-regular fa-user text-sm"></i>
          </span>
          <input type="text" name="username" id="username" required placeholder="Enter username" 
            class="glass-input w-full h-11 pl-10 pr-4 rounded-xl text-sm focus:outline-none placeholder-slate-600">
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label for="password" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Password</label>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
            <i class="fa-solid fa-lock text-sm"></i>
          </span>
          <input type="password" name="password" id="password" required placeholder="••••••••" 
            class="glass-input w-full h-11 pl-10 pr-4 rounded-xl text-sm focus:outline-none placeholder-slate-600">
        </div>
      </div>

      <button type="submit" 
        class="w-full h-11 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white text-sm font-semibold shadow-lg shadow-cyan-500/15 hover:shadow-cyan-500/25 transition-all transform active:scale-[0.98]">
        Sign In
      </button>

    </form>

    <div class="mt-8 pt-6 border-t border-slate-800 text-center text-xs text-slate-400">
      <span>Don't have an account? </span>
      <a href="{{ url_for('register') }}" class="text-cyan-400 font-semibold hover:underline">Sign up now</a>
    </div>
  </div>
</div>
{% endblock %}
